<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vista previa — Imágenes de pantalla</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#ecece8;color:#252f32;font-family:Arial,sans-serif}
    main{max-width:1440px;margin:auto;padding:25px 30px 20px}header{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:20px}
    h1{font-family:Georgia,serif;font-size:28px;font-weight:400;margin:0 0 6px}p{margin:0;color:#626a6c;font-size:14px;line-height:1.5}
    nav{display:flex;flex-wrap:wrap;gap:7px}button,a{font:inherit;font-size:14px;border-radius:7px;text-decoration:none}
    button{cursor:pointer;padding:11px 17px;background:#fff;color:#384346;border:1px solid #cdd1cc}button[aria-pressed="true"]{background:#273d3a;border-color:#273d3a;color:#fff}
    .television{background:#111;border:9px solid #262b2b;border-radius:13px;box-shadow:0 18px 40px #1b29252b;overflow:hidden;aspect-ratio:16/9;width:100%}
    iframe{display:block;width:100%;height:100%;border:0;background:#171717}.stand{height:15px;background:#383e3d;width:130px;margin:auto;border-radius:0 0 4px 4px}
    footer{margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:16px}footer a{display:inline-block;background:#fff;border:1px solid #cdd1cc;color:#273d3a;padding:10px 16px;white-space:nowrap}
    @media(max-width:850px){main{padding:18px 12px}header{display:block}nav{margin-top:14px}h1{font-size:25px}button{padding:9px 11px}footer{align-items:flex-start;flex-direction:column}.television{border-width:5px}}
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Así se vería en tu pantalla</h1><p>Compara imágenes completas, folletos y collages en formato de televisión.</p></div>
      <nav aria-label="Elegir ejemplo">
        <button type="button" data-row="2" aria-pressed="true">Cumpleaños</button>
        <button type="button" data-row="3" aria-pressed="false">Folleto vertical</button>
        <button type="button" data-row="4" aria-pressed="false">2 imágenes</button>
        <button type="button" data-row="5" aria-pressed="false">4 imágenes</button>
      </nav>
    </header>
    <div class="television"><iframe id="imagePreview" src="images.html?preview=2" title="Vista previa de la diapositiva"></iframe></div>
    <div class="stand"></div>
    <footer>
      <p>Los folletos son ejemplos visuales. Controla las imágenes, los segundos y la cantidad desde la pestaña <strong>IMÁGENES PANTALLA</strong>.</p>
      <a id="openImage" href="images.html?preview=2" target="_blank" rel="noopener">Abrir a pantalla completa ↗</a>
    </footer>
  </main>
  <script>
    const frame=document.getElementById('imagePreview');
    const openImage=document.getElementById('openImage');
    document.querySelectorAll('button[data-row]').forEach(button=>{
      button.addEventListener('click',()=>{
        document.querySelectorAll('button[data-row]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
        const url='images.html?preview='+button.dataset.row;
        frame.src=url;
        openImage.href=url;
      });
    });
  </script>
</body>
</html>
