name: Browser test native responsibilities
on:
  push:
    paths:
      - '.github/workflows/browser-test-responsibilities.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test live production board and native slide
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1920,height:1080}});
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message.slice(0,200)));
            page.on('console',msg=>{if(msg.type()==='error')console.log('PAGE_CONSOLE_ERROR',msg.text().slice(0,200))});
            await page.goto('https://projmodesto-prog.github.io/curated-production-board/?test=20261123native',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            const result=await page.evaluate(async()=>{
              await refreshMasterV144();
              await refreshResponsibilitiesV145();
              return {master:mvixMasterV144.responsibilities,enabled:responsibilitiesV145?.enabled,taskCount:responsibilitiesV145?.rows?.length||0,seconds:responsibilitiesV145?.seconds,nativeSlide:!!document.getElementById('responsibilitiesSlide')};
            });
            console.log('BROWSER_NATIVE_RESPONSIBILITIES',JSON.stringify(result));
            if(!result.master||!result.enabled||result.taskCount<2||!result.nativeSlide)throw Error('Native slide not ready');
            await page.evaluate(()=>{showResponsibilitiesV145('PRODUCTION BOARD');});
            await page.waitForTimeout(1000);
            const visible=await page.locator('#responsibilitiesSlide').evaluate(el=>el.classList.contains('isActive')&&getComputedStyle(el).display!=='none');
            console.log('NATIVE_RESPONSIBILITIES_VISIBLE',visible);
            if(!visible)throw Error('Native slide did not become visible');
            await page.reload({waitUntil:'domcontentloaded'});
            const automatic=await page.waitForFunction(()=>{
              const el=document.getElementById('responsibilitiesSlide');
              return !!el && el.classList.contains('isActive') && getComputedStyle(el).display!=='none';
            },null,{timeout:65000}).then(()=>true).catch(()=>false);
            console.log('AUTOMATIC_ROTATION_VISIBLE',automatic);
            if(!automatic)throw Error('Native responsibilities did not enter automatic rotation');
            const samples=[];
            for(let i=0;i<55;i++){
              await page.waitForTimeout(500);
              samples.push(await page.evaluate(()=>{
                const visible=id=>{
                  const el=document.getElementById(id);
                  return !!el && el.classList.contains('isActive') && getComputedStyle(el).display!=='none';
                };
                return {
                  routesOn:mvixMasterV144.routes,
                  responsibilitiesOn:mvixMasterV144.responsibilities,
                  screens:['responsibilitiesSlide','weeklyScheduleSlide','todayCrewSlide','screenImagesOverlay'].filter(visible),
                  noRoutesText:(document.getElementById('routesBody')?.innerText||'').includes('NO ROUTES SELECTED')
                };
              }));
            }
            let maxBlank=0,currentBlank=0;
            for(const sample of samples){
              currentBlank=(!sample.routesOn && sample.responsibilitiesOn && !sample.screens.length)?currentBlank+1:0;
              maxBlank=Math.max(maxBlank,currentBlank);
            }
            const noRoutesSeen=samples.some(x=>x.noRoutesText && !x.routesOn);
            console.log('POST_ROTATION_MONITOR',JSON.stringify({
              maxBlankHalfSecondSamples:maxBlank,noRoutesSeen,
              screensSeen:[...new Set(samples.flatMap(x=>x.screens))],
              first:samples.slice(0,3),last:samples.slice(-3)
            }));
            if(noRoutesSeen || maxBlank>5)throw Error('Unwanted blank routes board between enabled slides');
            await browser.close();
          })().catch(e=>{console.error('BROWSER_TEST_FAILED',e.stack);process.exit(1)});
          JS
