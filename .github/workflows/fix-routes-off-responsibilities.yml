name: Fix routes-off responsibility display
on:
  push:
    paths:
      - '.github/workflows/fix-routes-off-responsibilities.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve responsibilities fallback while rotating weekly schedule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  if(shouldShowWeekly() || shouldShowTodaysCrew()) return;
            if(masterAllowsV144('images') && window.ScreenImages?.hasSlides()) return;"""
          new="""  // Do not interrupt an actual weekly schedule, crew, or image slide.
            // An enabled switch alone must not hide the responsibilities fallback.
            if(activeExtraSlide && activeExtraSlide!=='responsibilitiesSlide'){
              const other=document.getElementById(activeExtraSlide);
              if(other && other.classList.contains('isActive')) return;
            }
            const imagesOverlay=document.getElementById('screenImagesOverlay');
            if(imagesOverlay && imagesOverlay.classList.contains('isActive')) return;"""
          assert s.count(old)==1,'Expected fallback guard not found'
          s=s.replace(old,new,1)
          assert s.count("const imagesOverlay=document.getElementById('screenImagesOverlay')")==1
          p.write_text(s,encoding='utf-8')
          print('VISIBILITY CHECK FIXED: RESPECT CURRENTLY ACTIVE SLIDES')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Show responsibilities between actual weekly and crew presentations"
            git push
          fi
