name: Fix routes-off responsibility display
on:
  push:
    paths:
      - '.github/workflows/fix-routes-off-responsibilities.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Keep responsibilities visible continuously when routes are hidden
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle='async function showNoRoutes(){'
          assert s.count(needle)==1,'Cannot find native no-routes method'
          snippet="""// If routes are disabled and the only active presentation is Daily Responsibilities,
          // keep its native slide visible between timer refreshes (instead of the routes board).
          function holdResponsibilitiesWhenRoutesAreOff(){
            if(window.matchMedia && window.matchMedia('(max-width:960px)').matches) return;
            if(masterAllowsV144('routes') || !shouldShowResponsibilitiesV145()) return;
            if(shouldShowWeekly() || shouldShowTodaysCrew()) return;
            if(masterAllowsV144('images') && window.ScreenImages?.hasSlides()) return;
            const slide=document.getElementById('responsibilitiesSlide');
            if(!slide || slide.classList.contains('isActive')) return;
            renderResponsibilitiesV145(responsibilitiesV145,responsibilitiesV145.rows.slice(0,9));
            setExtraSlideActive('responsibilitiesSlide');
            nextVisibleLabel='DAILY RESPONSIBILITIES';
            updateTimerText();
          }
          setInterval(holdResponsibilitiesWhenRoutesAreOff,1000);
          
          """
          assert 'function holdResponsibilitiesWhenRoutesAreOff()' not in s
          s=s.replace(needle,snippet+needle,1)
          assert s.count('function holdResponsibilitiesWhenRoutesAreOff()')==1
          p.write_text(s,encoding='utf-8')
          print('PERSISTENT RESPONSIBILITIES MONITOR INSTALLED')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Prevent blank routes screen from replacing sole responsibilities slide"
            git push
          fi
