name: Check MVIX responsibilities data access
on:
  push:
    paths:
      - '.github/workflows/check-mvix-data.yml'
      - 'daily-responsibilities.js'
      - 'screen-images.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Sheet visibility without printing personal task data
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re
          base='https://docs.google.com/spreadsheets/d/1wCCkZeA1R_dYFx-k-MYXMY-PUvaW4A9U5oeXQHfm7Ag/gviz/tq'
          for name,gid,rg in [('master',1987654460,'A1:C8'),('daily',1987654470,'A1:F60'),('employee',1987654340,'A1:F12')]:
              args=urllib.parse.urlencode({'gid':gid,'range':rg,'headers':'0','tq':'select *','tqx':'out:json;responseHandler:probe'})
              try:
                  with urllib.request.urlopen(base+'?'+args,timeout=20) as response:
                      body=response.read().decode('utf-8','replace')
                      ok=bool(re.search(r'"status"\s*:\s*"ok"',body))
                      print(name,'HTTP',response.status,'GVIZ_OK',ok,'BODY_BYTES',len(body))
                      if not ok: print(name,'ACCESS_ERROR')
              except Exception as e: print(name,'FETCH_FAILURE',type(e).__name__,str(e)[:140])
          PY
      - name: Inspect controls row alignment without private task data
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, re
          base='https://docs.google.com/spreadsheets/d/1wCCkZeA1R_dYFx-k-MYXMY-PUvaW4A9U5oeXQHfm7Ag/gviz/tq'
          for name,gid,rg in [('master',1987654460,'A1:C8'),('daily',1987654470,'A1:F15')]:
              q=urllib.parse.urlencode({'gid':gid,'range':rg,'headers':0,'tq':'select *','tqx':'out:json;responseHandler:probe'})
              raw=urllib.request.urlopen(base+'?'+q,timeout=15).read().decode()
              body=json.loads(raw[raw.index('(')+1:raw.rindex(')')])
              rows=body['table']['rows']
              print(name,'ROW_COUNT',len(rows))
              for i,row in enumerate(rows[:12]):
                  cells=row.get('c') or []
                  first=str((cells[0] or {}).get('f') or (cells[0] or {}).get('v') or '') if cells else ''
                  if name=='master':
                      second=str((cells[1] or {}).get('f') or (cells[1] or {}).get('v') or '') if len(cells)>1 else ''
                      print('MASTER_ROW',i,repr(first),repr(second))
                  elif i<=4:
                      second=str((cells[1] or {}).get('f') or (cells[1] or {}).get('v') or '') if len(cells)>1 else ''
                      show=str((cells[5] or {}).get('f') or (cells[5] or {}).get('v') or '') if len(cells)>5 else ''
                      print('DAILY_ROW',i,repr(first),repr(second) if i in [1,2] else '[omitted]',repr(show))
              if name=='daily': print('TASKS_AFTER_HEADER',sum(bool((r.get('c') or [None,None])[1]) for r in rows[4:]))
          PY
      - name: Verify javascript syntax and central hooks
        run: |
          node --check daily-responsibilities.js
          node --check screen-images.js
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text()
          assert index.count('await window.DailyResponsibilities?.playOnce?.();')==2
          assert index.count('daily-responsibilities.js?v=20261123c')==1
          assert 'setInterval(cycle' not in Path('daily-responsibilities.js').read_text()
          assert 'Daily responsibilities MVIX slide' not in Path('screen-images.js').read_text()
          print('MVIX ROTATION INTEGRATION OK')
          PY
