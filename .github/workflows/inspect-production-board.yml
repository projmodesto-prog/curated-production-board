name: Inspect production board integration
on:
  push:
    paths:
      - '.github/workflows/inspect-production-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect main board and sheet integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          print('INDEX_BYTES',len(s))
          print('RESPONSIBILITIES ELEMENT COUNT',s.count('id="responsibilitiesSlide"'))
          print('MAIN PAGE NATIVE CALL COUNT',s.count('showResponsibilitiesV145('))
          print('EXTRA SLIDE CLASS COUNT',s.count('class="extraSlide'))
          for term in ['function hideExtraSlides','async function showExtraSlide','async function showNoRoutes','function scheduleRotation','async function advanceRotationStep']:
              m=re.search(re.escape(term),s,re.I)
              if m:
                  print('SECTION',term)
                  print(s[m.start():min(len(s),m.start()+3100)])
          PY
