name: Inspect production board integration
on:
  push:
    paths:
      - '.github/workflows/inspect-production-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect main board and sheet integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          print('INDEX_BYTES',len(s))
          print('RESPONSIBILITIES ELEMENT COUNT',s.count('id="responsibilitiesSlide"'))
          print('MAIN PAGE NATIVE CALL COUNT',s.count('showResponsibilitiesV145('))
          print('EXTRA SLIDE CLASS COUNT',s.count('class="extraSlide'))
          for term in ['.extraClock{','.extraClockDate{','.extraClockTime{','updateExtraClocks();','setInterval(updateExtraClocks','setInterval(() => updateExtraClocks']:
              matches=list(re.finditer(re.escape(term),s,re.I))
              print('SECTION',term,'COUNT',len(matches))
              for m in matches[:8]:
                  print(s[max(0,m.start()-180):min(len(s),m.start()+450)])
          PY
