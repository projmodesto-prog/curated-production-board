name: Inspect production board integration
on:
  push:
    paths:
      - '.github/workflows/inspect-production-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect main board and sheet integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          print('INDEX_BYTES',len(s))
          for term in ['const RESPONSIBILITIES_GID_V145','function shouldShowResponsibilitiesV145','async function showResponsibilitiesV145','function fetchExtraSheetOnce','function startApp','showNoRoutes()','await runEmployeeSlideSequence']:
              m=re.search(re.escape(term),s,re.I)
              if m:
                  print('====',term,'====')
                  print(s[m.start():min(len(s),m.start()+4700)])
          PY
