name: Inspect production board integration
on:
  push:
    paths:
      - '.github/workflows/inspect-production-board.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect main board and sheet integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          print('INDEX_BYTES',len(s))
          for term in ['async function advanceRotationStep','async function showNoRoutes','async function runEmployeeSlideSequence','async function rotate','function masterAllowsV144','await window.DailyResponsibilities','DailyResponsibilities?.playOnce','rotationTimeout=setTimeout','function startCountdown','function scheduleRotation']:
              m=re.search(re.escape(term),s,re.I)
              if m:
                  print('====',term,'====')
                  print(s[max(0,m.start()-280):min(len(s),m.start()+3500)])
          print('END OF INSPECTION')
          PY
