name: Integrate daily responsibilities in production board
on:
  push:
    paths:
      - '.github/workflows/integrate-daily-responsibilities.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add responsibilities to the same MVIX rotation as employee schedules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, tag_count = re.subn(r'<script src="daily-responsibilities\.js\?v=[^"]+"></script>', '<script src="daily-responsibilities.js?v=20261123c"></script>', s)
          if tag_count != 1:
              raise SystemExit('Expected one responsibilities script tag; got '+str(tag_count))
          marker = "await window.DailyResponsibilities?.playOnce?.();"
          if marker not in s:
              source = "      await displayDay(found,true);"
              if s.count(source) != 1:
                  raise SystemExit('Cannot locate central route sequence')
              s = s.replace(source, "      " + marker + "\n" + source, 1)
              source = "    rotationTimeout=setTimeout(advanceRotationStep,5000);"
              if s.count(source) != 1:
                  raise SystemExit('Cannot locate no-routes central sequence')
              s = s.replace(source, "    " + marker + "\n" + source, 1)
          p.write_text(s,encoding='utf-8')
          print('Central rotation integration verified:', s.count(marker), 'hooks')
          if s.count(marker) != 2:
              raise SystemExit('Expected exactly 2 rotation hooks')
          PY
      - name: Commit main display integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Rotate Daily Responsibilities with existing MVIX schedule screens"
            git push
          fi
