name: Integrate daily responsibilities in production board
on:
  push:
    paths:
      - '.github/workflows/integrate-daily-responsibilities.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add responsibilities to the same MVIX rotation as employee schedules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, tag_count = re.subn(r'<script src="daily-responsibilities\.js\?v=[^"]+"></script>', '<script src="daily-responsibilities.js?v=20261123c"></script>', s)
          if tag_count != 1:
              raise SystemExit('Expected one responsibilities script tag; got '+str(tag_count))
          marker = "await window.DailyResponsibilities?.playOnce?.();"
          if marker not in s:
              s, route_count = re.subn(r'(?m)^(\s*)await displayDay\(found,\s*true\);', lambda m: m.group(1) + marker + "\n" + m.group(0), s, count=1)
              s, empty_count = re.subn(r'(?m)^(\s*)rotationTimeout\s*=\s*setTimeout\(advanceRotationStep,\s*5000\);', lambda m: m.group(1) + marker + "\n" + m.group(0), s, count=1)
              print('Hooks:', route_count,empty_count)
              if route_count != 1 or empty_count != 1:
                  raise SystemExit('Could not locate both rotation insertions')
          p.write_text(s,encoding='utf-8')
          print('Central rotation integration verified:', s.count(marker), 'hooks')
          if s.count(marker) != 2:
              raise SystemExit('Expected exactly 2 rotation hooks')
          PY
      - name: Commit main display integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Rotate Daily Responsibilities with existing MVIX schedule screens"
            git push
          fi
