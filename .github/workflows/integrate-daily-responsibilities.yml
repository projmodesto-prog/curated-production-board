name: Repair native daily responsibilities rotation
on:
  push:
    paths:
      - '.github/workflows/integrate-daily-responsibilities.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repair GViz row inference and use existing native MVIX slide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    const cfg=raw[1]||[], head=raw[2]||[];
    const rows=raw.slice(4).filter(r=>String(r[1]||'').trim());
    responsibilitiesV145={date:cfg[1]||'',location:cfg[3]||'',enabled:settingYes(cfg[5],false),seconds:settingSeconds(head[1],15),rows};"""
          new="""    // GViz may omit the first title row and return text labels in a TIME-typed column as empty.
    // Find the date/settings row by the SHOW DAY cell and locate the real table header.
    const headerIndex=raw.findIndex(r=>String(r[1]||'').trim().toUpperCase()==='RESPONSIBILITY');
    const cfg=raw.find((r,i)=>i<headerIndex && ['YES','NO'].includes(String(r[5]||'').trim().toUpperCase()))||[];
    const cfgIndex=raw.indexOf(cfg);
    const timer=raw.find((r,i)=>i<headerIndex && i!==cfgIndex && Number(r[1])>=3)||[];
    const rows=raw.slice(headerIndex>=0?headerIndex+1:3).filter(r=>String(r[1]||'').trim());
    responsibilitiesV145={date:cfg[1]||'',location:cfg[3]||'',enabled:settingYes(cfg[5],false),seconds:settingSeconds(timer[1],15),rows};"""
          if old not in s:
              raise SystemExit('Original responsibilities parser does not match; no changes made')
          s=s.replace(old,new,1)
          # The board already includes a native responsibilities slide and central sequence.
          # Remove the duplicate external overlay and duplicate invocation.
          s,n=re.subn(r'\s*<script src="daily-responsibilities\.js\?v=[^"]+"></script>', '',s)
          s=s.replace('await window.DailyResponsibilities?.playOnce?.();','')
          print('Removed external script tags:',n)
          assert n==1
          assert s.count('showResponsibilitiesV145(')>=2
          assert s.count('const headerIndex=raw.findIndex')==1
          assert 'daily-responsibilities.js?v=' not in s
          p.write_text(s,encoding='utf-8')
          print('NATIVE RESPONSIBILITIES PARSER FIX APPLIED')
          PY
      - name: Commit repaired main board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix native responsibilities GViz row parsing and remove duplicate overlay"
            git push
          fi
