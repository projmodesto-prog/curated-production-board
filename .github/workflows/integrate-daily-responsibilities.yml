name: Repair native daily responsibilities rotation
on:
  push:
    paths:
      - '.github/workflows/integrate-daily-responsibilities.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repair native responsibilities parser and remove duplicate slide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old1='    const cfg=raw[1]||[], head=raw[2]||[];'
          old2="    const rows=raw.slice(4).filter(r=>String(r[1]||'').trim());"
          old3="    responsibilitiesV145={date:cfg[1]||'',location:cfg[3]||'',enabled:settingYes(cfg[5],false),seconds:settingSeconds(head[1],15),rows};"
          assert all(old in s for old in [old1,old2,old3]), 'Original parser not found'
          s=s.replace(old1,"    const headerIndex=raw.findIndex(r=>String(r[1]||'').trim().toUpperCase()==='RESPONSIBILITY');\n    const cfg=raw.find((r,i)=>i<headerIndex && ['YES','NO'].includes(String(r[5]||'').trim().toUpperCase()))||[];\n    const cfgIndex=raw.indexOf(cfg);\n    const timer=raw.find((r,i)=>i<headerIndex && i!==cfgIndex && Number(r[1])>=3)||[];",1)
          s=s.replace(old2,"    const rows=raw.slice(headerIndex>=0?headerIndex+1:3).filter(r=>String(r[1]||'').trim());",1)
          s=s.replace(old3,"    responsibilitiesV145={date:cfg[1]||'',location:cfg[3]||'',enabled:settingYes(cfg[5],false),seconds:settingSeconds(timer[1],15),rows};",1)
          s,n=re.subn(r'\s*<script src="daily-responsibilities\.js\?v=[^"]+"></script>', '',s)
          assert n==1, 'Expected exactly one duplicate external script'
          s=s.replace('await window.DailyResponsibilities?.playOnce?.();','')
          assert s.count('const headerIndex=raw.findIndex')==1
          assert s.count('showResponsibilitiesV145(')>=2
          p.write_text(s,encoding='utf-8')
          print('NATIVE RESPONSIBILITIES PARSER FIX APPLIED')
          PY
      - name: Commit repaired board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix native responsibilities GViz parsing and remove duplicate slide"
            git push
          fi
