<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Responsibilities — Curated Events</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b2a;color:#f6f8fb;font:20px Arial,sans-serif}main{padding:3vw;min-height:100vh}.brand{letter-spacing:.14em;font-weight:bold;color:#cbd9e9}.stripe{height:5px;background:#9fb5cb;margin:20px 0}h1{font-size:clamp(35px,4.5vw,75px);margin:25px 0}.meta{display:flex;gap:40px;flex-wrap:wrap;color:#cfdaec;margin-bottom:35px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(13px,1.6vw,27px)}th{text-align:left;background:#243650;color:#d9e4f2;font-size:.75em}td,th{padding:1.3vw 1vw;border-bottom:1px solid #41516b;overflow-wrap:anywhere;vertical-align:top}th:nth-child(1){width:11%}th:nth-child(2){width:34%}th:nth-child(3){width:20%}th:nth-child(4){width:15%}th:nth-child(5){width:20%}.state{color:#9ce5b6;font-weight:bold}#message{background:#293b52;padding:22px;border-radius:8px}button{float:right;padding:10px 17px;color:white;background:#315071;border:1px solid #7091b8;border-radius:5px;cursor:pointer}footer{margin-top:25px;color:#a4b3c6;font-size:14px}
</style></head><body><main><button id="refresh">REFRESH</button><div class="brand">CURATED EVENTS ⛺<div style="font-size:13px;margin-top:8px">TENT &amp; PRODUCTION DIVISION</div></div><div class="stripe"></div><h1>DAILY RESPONSIBILITIES</h1><div class="meta"><span id="date">DATE: —</span><span id="location">LOCATION: —</span></div><div id="message">Loading Google Sheets…</div><table id="table" hidden><thead><tr><th>TIME</th><th>RESPONSIBILITY</th><th>ASSIGNED CREW</th><th>LOCATION</th><th>STATUS / NOTES</th></tr></thead><tbody></tbody></table><footer>Pro DAILY ROUTES · Automatic refresh every 60 seconds</footer></main><script>
(function(){'use strict';const endpoint='https://docs.google.com/spreadsheets/d/1wCCkZeA1R_dYFx-k-MYXMY-PUvaW4A9U5oeXQHfm7Ag/gviz/tq';const table=document.getElementById('table'),message=document.getElementById('message');let loading=false;
function fetchRows(gid,range){return new Promise((resolve,reject)=>{const id='__dr_'+Date.now()+'_'+Math.floor(Math.random()*1e6),script=document.createElement('script');let done=false;const finish=(error,rows)=>{if(done)return;done=true;clearTimeout(timer);script.remove();delete window[id];error?reject(error):resolve(rows)};const timer=setTimeout(()=>finish(new Error('Google Sheets timeout. Check sharing permissions.')),12000);window[id]=r=>{if(r?.status!=='ok'||!r.table)return finish(new Error('Google Sheets returned an access or data error.'));finish(null,(r.table.rows||[]).map(row=>Array.from({length:6},(_,i)=>String(row.c?.[i]?.f??row.c?.[i]?.v??'').trim())))};script.onerror=()=>finish(new Error('Network error loading Google Sheets'));script.src=endpoint+'?'+new URLSearchParams({gid:String(gid),range,headers:'0',tq:'select *',tqx:'out:json;responseHandler:'+id,cacheBust:String(Date.now())});document.head.appendChild(script)})}
const yes=s=>String(s||'').trim().toUpperCase()==='YES',today=()=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',month:'2-digit',day:'2-digit',year:'numeric'}).format(new Date()),normalize=s=>{const m=String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0')+'/'+m[3]:String(s)};
async function refresh(){if(loading)return;loading=true;message.hidden=false;message.textContent='Loading Google Sheets…';try{const [controls,rows]=await Promise.all([fetchRows(1987654460,'A1:C8'),fetchRows(1987654470,'A1:F65')]);const switches=new Map(controls.map(r=>[r[0].toUpperCase(),r[1]]));const date=rows.find(r=>r[0].toUpperCase()==='DATE');if(!date)throw Error('DATE row missing in DAILY RESPONSIBILITIES');document.getElementById('date').textContent='DATE: '+date[1];document.getElementById('location').textContent='LOCATION: '+(date[3]||'—');const header=rows.findIndex(r=>r[0].toUpperCase()==='TIME'&&r[1].toUpperCase()==='RESPONSIBILITY');const tasks=rows.slice(header+1).filter(r=>r[1]||r[2]||r[4]);const tbody=table.querySelector('tbody');tbody.replaceChildren();for(const r of tasks){const tr=document.createElement('tr');[r[0],r[1],r[2],r[3],(r[4]||'')+(r[5]?' — '+r[5]:'')].forEach((s,i)=>{const td=document.createElement('td');td.textContent=s;if(i===4)td.className='state';tr.append(td)});tbody.append(tr)}let reason='';if(!yes(switches.get('SHOW DAILY RESPONSIBILITIES'))||!yes(date[5]))reason='The master switch or SHOW DAY is set to NO.';else if(normalize(date[1])!==today())reason='The date is '+date[1]+' but today is '+today()+'. Change the DATE cell.';else if(!tasks.length)reason='No responsibilities entered.';table.hidden=!!reason;message.hidden=!reason;if(reason)message.textContent=reason;}catch(error){table.hidden=true;message.hidden=false;message.textContent='Cannot display responsibilities: '+error.message;}finally{loading=false}}
document.getElementById('refresh').onclick=refresh;refresh();setInterval(refresh,60000);
})();</script></body></html>
